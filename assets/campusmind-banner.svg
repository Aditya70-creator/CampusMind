<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1124" />
      <stop offset="100%" stop-color="#071929" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background & Grid -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Glowing Left Accent Bar -->
  <rect x="0" y="45" width="6" height="230" rx="3" fill="url(#accent)" filter="url(#glow)" />

  <!-- Animated Pulse Orbs -->
  <circle cx="980" cy="90" r="95" fill="#38bdf8" opacity="0.06" filter="url(#glow)">
    <animate attributeName="r" values="85;110;85" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="220" r="80" fill="#34d399" opacity="0.06" filter="url(#glow)">
    <animate attributeName="r" values="70;95;70" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Top Pill Badge -->
  <rect x="55" y="42" width="340" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
  <circle cx="74" cy="57" r="5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="90" y="62" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">CAREER INTELLIGENCE & ATS PLATFORM</text>

  <!-- Main Heading -->
  <text x="55" y="132" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">CampusMind</text>
  <text x="55" y="172" fill="url(#accent)" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="600">AI Resume ATS Matcher • Application Pipeline • Coding Analytics</text>

  <!-- Description -->
  <text x="55" y="212" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="15">TF-IDF & Cosine Similarity Scoring • Automated Keyword Gap Extraction • FastAPI + Streamlit UI</text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(55, 240)" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">
    <rect x="0" y="0" width="155" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="77" y="20" text-anchor="middle" fill="#e2e8f0">⚡ TF-IDF Cosine Engine</text>

    <rect x="170" y="0" width="155" height="32" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1" />
    <text x="247" y="20" text-anchor="middle" fill="#e2e8f0">🎯 Keyword Gap Analyzer</text>

    <rect x="340" y="0" width="145" height="32" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <text x="412" y="20" text-anchor="middle" fill="#e2e8f0">🚀 FastAPI + Pytest</text>
  </g>

  <!-- Right Side Telemetry Card -->
  <rect x="780" y="45" width="365" height="230" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
  <text x="805" y="78" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="0.8">LIVE ATS DIAGNOSTICS PREVIEW</text>
  <line x1="805" y1="90" x2="1120" y2="90" stroke="#334155" stroke-width="1" />

  <!-- Metric Bars -->
  <text x="805" y="122" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="13">Resume-JD Alignment</text>
  <text x="1120" y="122" text-anchor="end" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">86.4%</text>
  <rect x="805" y="132" width="315" height="8" rx="4" fill="#090d16" />
  <rect x="805" y="132" width="272" height="8" rx="4" fill="url(#accent)" />

  <text x="805" y="170" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="13">Technical Keyword Coverage</text>
  <text x="1120" y="170" text-anchor="end" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">14 / 16 Matched</text>
  <rect x="805" y="180" width="315" height="8" rx="4" fill="#090d16" />
  <rect x="805" y="180" width="245" height="8" rx="4" fill="#38bdf8" />

  <!-- Status Footer Inside Card -->
  <rect x="805" y="212" width="315" height="42" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  <circle cx="825" cy="233" r="5" fill="#10b981" />
  <text x="840" y="238" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">STATUS: READY_FOR_SHORTLIST</text>
</svg>